name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The plugin runtime targets PHP 7.4+, but the dev test tooling
        # (PHPUnit ^11) requires PHP 8.2+, so the suite runs on 8.2–8.4.
        php: [ '8.2', '8.3', '8.4' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run test suite
        run: composer test

  lint:
    name: PHPCS (WordPress Coding Standards)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-lint-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-lint-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHP_CodeSniffer
        run: composer lint

  fallow:
    name: Fallow (JS/TS intelligence)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so the audit can attribute new-vs-inherited findings
          # against the base branch.
          fetch-depth: 0

      # Fallow audits the front-end scripts under admin/ and public/ assets
      # (unused code, duplication, complexity). It only covers JS/TS — the PHP
      # is handled by the PHPUnit and PHPCS jobs above.
      #
      # Gate: `audit` + `gate: new-only` fails the build only on findings the
      # change introduces. The committed baselines under .github/fallow-baselines
      # pin the existing asset findings as inherited, so they never trip the
      # gate. Regenerate a baseline after intentionally changing the scripts:
      #   npx fallow dead-code --save-baseline .github/fallow-baselines/dead-code.json
      #   npx fallow health    --save-baseline .github/fallow-baselines/health.json
      #   npx fallow dupes     --save-baseline .github/fallow-baselines/dupes.json
      - name: Fallow audit (new-only gate)
        uses: fallow-rs/fallow@v2
        with:
          command: audit
          gate: new-only
          fail-on-issues: true
          dead-code-baseline: .github/fallow-baselines/dead-code.json
          health-baseline: .github/fallow-baselines/health.json
          dupes-baseline: .github/fallow-baselines/dupes.json
